<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F1F4F5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="CarBravo frontend application" />
    <title>CarBravo</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F5F7F8;
        opacity: 1;
        visibility: visible;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      #boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
      }

      .boot-loader-logo {
        display: block;
        width: min(440px, 78vw);
        height: auto;
        object-fit: contain;
      }

      .boot-loader-product {
        margin-top: 32px;
        color: #174A58;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.32em;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-loader {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading CarBravo">
      <div class="boot-loader-content">
        <img src="/logo.svg" alt="CarBravo" class="boot-loader-logo" />
        <div class="boot-loader-product">INCENTIVES</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
